<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Monaco Editor</title>

    <meta
      name="description"
      content="Collaborative code editor module for Edrys classrooms, built on Monaco Editor with real-time CRDT sync.<br/>For more information visit: <a href='https://github.com/edrys-labs/module-monaco-editor' target='_blank'>https://github.com/edrys-labs/module-monaco-editor</a>"
    />

    <meta
      name="module-config"
      content="{
        'config': {
          'editorId': {
            'type': 'string',
            'hint': 'Unique ID to namespace shared state — set different values when using multiple editors in the same room'
          },
          'value': {
            'type': 'text-area',
            'hint': 'Initial code shown in the editor'
          },
          'runCommand': {
            'type': 'string',
            'hint': 'Message subject sent when Execute is clicked (default: execute)'
          },
          'language': {
            'type': 'string',
            'hint': 'Editor language: cpp, javascript, python, etc.'
          },
          'theme': {
            'type': 'radio-button',
            'options': ['auto', 'vs-light', 'vs-dark'],
            'hint': 'Editor colours; auto follows the light/dark setting of each device'
          },
          'synchronize': {
            'type': 'boolean',
            'hint': 'Share one document across all peers in the room; otherwise each peer edits its own copy'
          },
          'readOnly': {
            'type': 'boolean',
            'hint': 'Make the editor read-only for everyone'
          },
          'showLanguageSelector': {
            'type': 'boolean',
            'hint': 'Let teachers and stations change the language for everyone'
          }
        }
      }"
    />

    <!-- Edrys client API -->
    <script src="https://edrys-labs.github.io/module/edrys.js"></script>

    <!-- Module logic -->
    <script type="module" src="./editor.js"></script>

    <!-- Monaco editor base styles -->
    <link
      rel="stylesheet"
      href="../node_modules/monaco-editor/min/vs/editor/editor.main.css"
    />
    <!-- Edrys base styles (water.css) -->
    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/water.min.css"
    />
    <!-- Edrys icons (open-iconic) -->
    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css"
    />
    <!-- Module styles -->
    <link rel="stylesheet" href="./editor.css" />
  </head>

  <body>
    <div id="editor"></div>

    <div id="controls">
      <button id="btn-execute" onclick="execute()">
        <span class="oi" data-glyph="media-play" aria-hidden="true"></span> Execute
      </button>
      <button id="btn-reset" onclick="reset()">
        <span class="oi" data-glyph="reload" aria-hidden="true"></span> Reset
      </button>

      <select id="lang-select" aria-label="Language" onchange="setLanguage(this.value)">
        <option value="cpp">C++</option>
        <option value="c">C</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="java">Java</option>
        <option value="csharp">C#</option>
        <option value="go">Go</option>
        <option value="rust">Rust</option>
        <option value="bash">Bash</option>
        <option value="sql">SQL</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="json">JSON</option>
        <option value="yaml">YAML</option>
        <option value="markdown">Markdown</option>
        <option value="plaintext">Plain Text</option>
      </select>

      <span id="lang-badge"></span>
      <span id="sync-dot" role="img"></span>
    </div>
  </body>
</html>
